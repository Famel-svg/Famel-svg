name: Atualizar contribuições

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-contributions.yml'

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar leitura e geração
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Gerar calendário
        run: python scripts/update_contributions.py
      - name: Salvar apenas quando houver mudanças
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar contribuições [skip ci]'
            git push
          fi
