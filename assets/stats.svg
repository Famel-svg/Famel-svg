<svg xmlns="http://www.w3.org/2000/svg" width="470" height="252" viewBox="0 0 470 252" role="img" aria-label="stats">
  <defs>
    <linearGradient id="stats-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="0.55" stop-color="#0d1a33"/><stop offset="1" stop-color="#05070d"/></linearGradient>
    <radialGradient id="stats-o1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0.45"/><stop offset="0.6" stop-color="#58a6ff" stop-opacity="0.1"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="stats-o2"><stop offset="0" stop-color="#3fb950" stop-opacity="0.35"/><stop offset="0.6" stop-color="#3fb950" stop-opacity="0.08"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient>
    <linearGradient id="stats-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
    <clipPath id="stats-clip"><rect x="1" y="1" width="468" height="250" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#stats-clip)"><rect width="470" height="252" fill="url(#stats-bg)"/>
    <circle cx="60" cy="10" r="227" fill="url(#stats-o1)"/><circle cx="430" cy="242" r="202" fill="url(#stats-o2)"/></g>
  <rect x="1" y="1" width="468" height="250" rx="18" fill="none" stroke="#58a6ff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="28" y="34" fill="#9ecbff" font-family="Consolas,monospace" font-size="14">stats</text>
  <line x1="28" y1="48" x2="442" y2="48" stroke="url(#stats-line)" stroke-opacity="0.7"/>
  <text x="28" y="78" fill="#58a6ff" font-family="Consolas,monospace" font-size="15">$ git stats --author rafael</text>
  <text x="28" y="112" fill="#9ecbff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15">Contribuições no último ano</text>
  <text x="440" y="112" fill="#e6f1ff" font-family="Consolas,monospace" font-size="15" font-weight="700" text-anchor="end">845</text>
  <text x="28" y="140" fill="#9ecbff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15">Commits no último ano</text>
  <text x="440" y="140" fill="#e6f1ff" font-family="Consolas,monospace" font-size="15" font-weight="700" text-anchor="end">688</text>
  <text x="28" y="168" fill="#9ecbff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15">Repositórios públicos</text>
  <text x="440" y="168" fill="#e6f1ff" font-family="Consolas,monospace" font-size="15" font-weight="700" text-anchor="end">25</text>
  <text x="28" y="196" fill="#9ecbff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15">Pull requests</text>
  <text x="440" y="196" fill="#e6f1ff" font-family="Consolas,monospace" font-size="15" font-weight="700" text-anchor="end">6</text>
  <text x="28" y="224" fill="#9ecbff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15">Estrelas recebidas</text>
  <text x="440" y="224" fill="#e6f1ff" font-family="Consolas,monospace" font-size="15" font-weight="700" text-anchor="end">7</text>
</svg>
