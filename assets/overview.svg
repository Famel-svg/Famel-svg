<svg xmlns="http://www.w3.org/2000/svg" width="960" height="252" viewBox="0 0 960 252" role="img" aria-label="Estatísticas e linguagens"><svg x="0" xmlns="http://www.w3.org/2000/svg" width="470" height="252" viewBox="0 0 470 252" role="img" aria-label="stats">
